<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuMind AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>📚 DocuMind AI</h1>
    <p>Upload PDFs and ask questions using AI.</p>
  </header>

  <div class="card">
    <h2>Upload PDF</h2>
    <div class="row">
      <input type="file" id="fileInput" accept=".pdf">
      <button id="uploadButton" onclick="uploadPdf()">Upload</button>
    </div>
    <p id="uploadStatus" class="status"></p>
  </div>

  <div class="card">
    <h2>Stored PDFs</h2>
    <ul id="docList" class="docs"></ul>
    <p id="listStatus" class="status"></p>
  </div>

  <div class="card">
    <h2>Ask Question</h2>
    <div class="row">
      <input type="text"  id="questionInput" placeholder="Ask something from your PDFs...">
      <button id="askButton" onclick="askQuestion()">Ask</button>
    </div>
    <p id="askStatus" class="status"></p>
    <div id="answerArea" style="display:none">
      <div id="answerText" class="answer-box"></div>
      <h3>Sources</h3>
      <div id="sourcesList"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
